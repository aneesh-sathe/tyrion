<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="title desc">
  <title id="title">Tyrion</title>
  <desc id="desc">Tyrion. One sentence in. Verified software out. Works with Claude Code, Codex, OpenCode and Pi.</desc>
  <defs>
    <radialGradient id="stage" cx="50%" cy="0%" r="90%">
      <stop offset="0" stop-color="#1c1c21"/>
      <stop offset="0.55" stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5e5ce6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#5e5ce6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f5f7"/>
      <stop offset="1" stop-color="#9d9da6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="word">
      <text x="600" y="220" text-anchor="middle" class="wordmark">Tyrion</text>
    </clipPath>
  </defs>
  <style>
    .wordmark { font: 700 132px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Helvetica Neue", Arial, sans-serif; letter-spacing: -4px; }
    .tagline { font: 500 34px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Helvetica Neue", Arial, sans-serif; letter-spacing: -0.4px; fill: #a1a1aa; }
    .pill { font: 600 17px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif; letter-spacing: 0.2px; }
    .rise { animation: rise 1.1s cubic-bezier(.2,.7,.2,1) both; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .75s; } .d3 { animation-delay: 1.25s; }
    .d4 { animation-delay: 1.35s; } .d5 { animation-delay: 1.45s; } .d6 { animation-delay: 1.55s; }
    .sweep { animation: sweep 7s ease-in-out 1.6s infinite; }
    .breathe { animation: breathe 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes sweep { 0% { transform: translateX(-520px); } 38%, 100% { transform: translateX(1720px); } }
    @keyframes breathe { 0%, 100% { opacity: .75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
    @media (prefers-reduced-motion: reduce) { .rise, .sweep, .breathe { animation: none; } }
  </style>

  <rect width="1200" height="440" rx="28" fill="url(#stage)"/>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="27.5" fill="none" stroke="#2c2c31"/>
  <ellipse class="breathe" cx="600" cy="185" rx="330" ry="120" fill="url(#glow)"/>

  <g class="rise d1">
    <text x="600" y="220" text-anchor="middle" class="wordmark" fill="url(#ink)">Tyrion</text>
    <g clip-path="url(#word)">
      <rect class="sweep" x="0" y="80" width="260" height="170" fill="url(#sheen)" opacity="0.9"/>
    </g>
  </g>

  <text class="tagline rise d2" x="600" y="286" text-anchor="middle">One sentence in. Verified software out.</text>

  <g class="pill">
    <g class="rise d3">
      <rect x="341" y="336" width="154" height="40" rx="20" fill="#1a1712" stroke="#3a2f1c"/>
      <circle cx="363" cy="356" r="5" fill="#ff9f0a"/>
      <text x="377" y="362" fill="#f2e6d0">Claude Code</text>
    </g>
    <g class="rise d4">
      <rect x="509" y="336" width="108" height="40" rx="20" fill="#10161f" stroke="#1d3350"/>
      <circle cx="531" cy="356" r="5" fill="#0a84ff"/>
      <text x="545" y="362" fill="#d6e6fb">Codex</text>
    </g>
    <g class="rise d5">
      <rect x="631" y="336" width="140" height="40" rx="20" fill="#18121d" stroke="#3a2446"/>
      <circle cx="653" cy="356" r="5" fill="#bf5af2"/>
      <text x="667" y="362" fill="#ecdcf5">OpenCode</text>
    </g>
    <g class="rise d6">
      <rect x="785" y="336" width="74" height="40" rx="20" fill="#0f1a1d" stroke="#1d3d45"/>
      <circle cx="807" cy="356" r="5" fill="#64d2ff"/>
      <text x="821" y="362" fill="#d3eef7">Pi</text>
    </g>
  </g>
</svg>
