[package]
name = "tyrion"
version = "0.1.0"
edition = "2021"
description = "A durable local orchestration runtime for coding commissions"
license = "MIT"

[lib]
name = "tyrion"
path = "src/lib.rs"

[[bin]]
name = "tyrion"
path = "src/bin/tyrion.rs"

[[bin]]
name = "tyriond"
path = "src/bin/tyriond.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
