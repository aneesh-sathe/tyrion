version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /sys/fs/cgroup
    - /dev/urandom
    - /etc
    - /var/log
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
landlock:
  compatibility: hard_requirement
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  claude:
    name: claude
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        access: full
        enforcement: enforce
      - host: claude.ai
        port: 443
        protocol: rest
        access: full
        enforcement: enforce
      - host: platform.claude.com
        port: 443
        protocol: rest
        access: full
        enforcement: enforce
    binaries:
      - path: /sandbox/claude
